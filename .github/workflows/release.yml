name: 构建并发布绿色版

# ============================================================================
# 为什么打包放在 GitHub 上做：
#   作者本机往 GitHub 传大文件会被限速，而 GitHub 的 asset 保存超过约 30 秒就报
#   "Error saving asset"。放到 runner 上打包 + 上传，全程在 GitHub 内网里，
#   又快又稳。本地也能用同一个脚本（构建/在服务器上构建.sh）跑。
#
# 触发方式：
#   · 手动：Actions → 构建并发布绿色版 → Run workflow（填版本号，默认 V1.0.0）
#   · 打标签：git push origin V1.0.0
# ============================================================================
on:
  workflow_dispatch:
    inputs:
      版本:
        description: '版本号（要和 Release 的 tag 一致，例如 V1.0.0）'
        required: true
        default: 'V1.0.0'
  push:
    tags:
      - 'V*'

permissions:
  contents: write

jobs:
  build:
    name: 打包（Linux + Windows × 完整版/精简版）
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 装打包工具（7z / unzip）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unzip

      - name: 组装运行环境并打四个包
        run: bash 构建/在服务器上构建.sh
        env:
          HF_ENDPOINT: https://hf-mirror.com

      - name: 包名改成 ASCII（GitHub 资源名会把中文清洗成 -）
        id: rename
        run: |
          set -e
          mkdir -p 待发布
          mv "构建/发布/网盘管理-V1.0.0-Linux-完整版-含AI语音模型.zip"    "待发布/wangpan-manager-V1.0.0-Linux-full-with-whisper-model.zip"
          mv "构建/发布/网盘管理-V1.0.0-Linux-精简版-不含模型.zip"        "待发布/wangpan-manager-V1.0.0-Linux-lite-no-model.zip"
          mv "构建/发布/网盘管理-V1.0.0-Windows-完整版-含AI语音模型.zip"  "待发布/wangpan-manager-V1.0.0-Windows-full-with-whisper-model.zip"
          mv "构建/发布/网盘管理-V1.0.0-Windows-精简版-不含模型.zip"      "待发布/wangpan-manager-V1.0.0-Windows-lite-no-model.zip"
          cd 待发布 && sha256sum *.zip > SHA256SUMS.txt && cd ..
          ls -la 待发布/
          echo "版本=${{ github.event.inputs.版本 || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: 发布到 Release 并上传四个包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.版本 || github.ref_name }}
          name: 网盘管理 ${{ github.event.inputs.版本 || github.ref_name }} · 绿色免安装（Windows / Linux）
          body_path: 构建/发布说明.md
          files: |
            待发布/*.zip
            待发布/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
