name: 测试界面性能（Windows 真机）

# ============================================================================
# 干什么：在 GitHub 免费的 windows-latest（**真 Windows**）上量界面的真实开销。
#
# 为什么单独一个工作流：
#   * 本地 Linux/Wine 量不准 —— offscreen 平台是软件渲染，某些页面（播放页）会
#     慢到几十秒，跟真机完全不是一回事；
#   * 另一个工作流（测试Windows包）测的是**已发布的包**，得先发版才能跑；
#     这个工作流直接 checkout 源码 + pip 装依赖，改完代码马上就能量。
#
# 量什么（工具/界面测速.py）：
#   建主窗口（含预热各页）/ 切每个功能页 / AI 三个子页 / 登录对话框 / 追加 200 行日志，
#   并统计控件总数与样式表长度 —— 这些数字直接决定"界面卡不卡"。
#
# ⚠️ 踩过的坑（第一次跑就挂在这）：
#   Windows runner 的控制台是 **cp1252**，而这个项目的路径/日志全是中文 ——
#   `pip install -r 构建/依赖-主程序-win.txt` 时 pip 自己打印中文路径就
#   UnicodeEncodeError 而退出 1。所以：整个 job 强制 UTF-8（PYTHONUTF8/PYTHONIOENCODING），
#   并把依赖清单先复制成 ASCII 文件名再喂给 pip（中文不进 pip 的输出）。
#
# 触发：Actions → 测试界面性能（Windows 真机）→ Run workflow。
# ============================================================================

on:
  workflow_dispatch:
  push:
    paths:
      - 'v8_3/界面/**'
      - 'v8_3/播放/**'
      - 'v8_3/AI/**'          # AI 页也在这条链上（探测本地服务卡住过一次，60 秒）
      - '工具/界面测速.py'
      - '工具/主题测速.py'
      - '.github/workflows/测试界面Windows.yml'

permissions:
  contents: read

jobs:
  ui-speed:
    name: 在 windows-latest 上量界面开销
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      # 中文路径/中文日志在 cp1252 控制台上会炸，全局强制 UTF-8
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      QT_QPA_PLATFORM: 'offscreen'

    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 装依赖（PySide6 等）
        shell: pwsh
        run: |
          # 依赖清单先复制成 ASCII 文件名：pip 打印中文路径会因为 cp1252 报错退出
          Copy-Item '构建/依赖-主程序-win.txt' 'req-win.txt'
          python -m pip install --upgrade pip
          python -m pip install -r req-win.txt

      - name: 环境信息
        shell: pwsh
        run: |
          Write-Host "runner : $env:ImageOS / $env:RUNNER_OS / $env:RUNNER_ARCH"
          python -c "import sys, PySide6; print('Python', sys.version.split()[0], '| PySide6', PySide6.__version__)"

      - name: 界面逐项计时（真 Windows · 原生窗口）
        env:
          QT_QPA_PLATFORM: ''          # 空 = 用原生 windows 平台（跟用户实际一样）
        run: python 工具/界面测速.py

      - name: 界面逐项计时（真 Windows · 离屏）
        env:
          QT_QPA_PLATFORM: offscreen   # 离屏是纯软件渲染，数字通常更难看，用来对照
        run: python 工具/界面测速.py

      # ---- 主题样式表的"全局层"值多少钱：同几页再来一遍，但把全局规则换成调色板 ----
      # 背景：清掉整套 QSS 后切页从 12.3 秒掉到 40 毫秒 —— 贵的就是这张全局样式表。
      # 这一跑给出"换调色板能省多少"的真机数字，用来定默认值。
      - name: 界面逐项计时（真 Windows · 全局层=调色板）
        env:
          QT_QPA_PLATFORM: ''          # 原生窗口，跟用户实际一样
          V8_3_主题全局层: 调色板
        run: python 工具/界面测速.py

      - name: 主题全局层三档对照（合成控件树）
        run: python 工具/主题测速.py

      - name: 单测（Windows 上跑一遍）
        run: python -m unittest discover -s tests -t .
