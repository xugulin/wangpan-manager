name: 测试 Windows 发布包

# ============================================================================
# 这个工作流做什么（免费 Windows runner 上的实机测试）
#   GitHub 的 windows-latest 是真 Windows Server，所以可以在这里验证那些
#   "只有 Windows 上才会暴露"的问题 —— 本地 Linux/Wine 测不准：
#     ① 下载刚发布的 Windows 包（默认最新 Release，也可手动指定 tag / 直接上传 zip）
#     ② 校验包内容与版本号、检查有没有泄露构建机私有路径
#     ③ **创建桌面图标.bat** 端到端跑一遍（历史上这里乱码 + 创建失败）：
#        在"中文 + 空格"的路径下解压，再跑脚本，确认桌面真的出现 .lnk，且名字是中文
#     ④ 启动程序并抓日志（一键启动.log / 界面日志.txt / 卡顿诊断.log），
#        再把日志当 artifact 传上来，方便直接看结论
#
# 说明：Windows runner 是无交互会话，GUI 可能不渲染，所以 ④ 只做"能不能起来，
# 起来后卡在哪一步"的判断（不判定界面流畅度）；卡顿的现场证据靠 --性能诊断。
#
# 触发：Actions → 测试 Windows 发布包 → Run workflow
#      或推送带 win-test 字样的 tag。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空 = 最新一个 Release）'
        required: false
        default: ''
      url:
        description: '直接给一个 zip 直链（留空则用上面的 tag）'
        required: false
        default: ''
  push:
    tags:
      - '*-win-test'

permissions:
  contents: read

jobs:
  win-test:
    name: 在 windows-latest 上测发布包
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 基本信息
        shell: pwsh
        run: |
          Write-Host "runner : $env:ImageOS / $env:RUNNER_OS / $env:RUNNER_ARCH"
          Write-Host "版本   : $($PSVersionTable.PSVersion)"
          Write-Host "系统   : $([System.Environment]::OSVersion.VersionString)"
          Write-Host "工作目录: $PWD"

      - name: 解析下载地址并下载
        id: fetch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = $env:INPUT_URL
          if (-not $url) {
            $tag = $env:INPUT_TAG
            if (-not $tag) {
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
              $tag = $rel.tag_name
              Write-Host "最新 Release：$tag"
            } else {
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
            }
            $asset = $rel.assets | Where-Object { $_.name -like '*Windows*.zip' } | Select-Object -First 1
            if (-not $asset) { throw "这个 Release 里没有 Windows 包：$($rel.assets.name -join ', ')" }
            $url = $asset.browser_download_url
            Write-Host "资源：$($asset.name)  $([math]::Round($asset.size/1MB,1)) MB"
          }
          # 解压到"中文 + 空格"路径：历史上 创建桌面图标.bat 就是在中文路径下失败的
          $root = Join-Path $env:RUNNER_TEMP '中文 路径 测试\网盘管理'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'pkg.zip'
          Write-Host "下载：$url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Write-Host "包大小：$([math]::Round((Get-Item $zip).Length/1MB,1)) MB"
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $inner = Get-ChildItem -Path $root -Directory | Select-Object -First 1
          $app = if ($inner) { $inner.FullName } else { $root }
          Write-Host "解压到：$app"
          "APP=$app" >> $env:GITHUB_OUTPUT

      - name: 包内容与版本号
        shell: pwsh
        run: |
          $app = '${{ steps.fetch.outputs.APP }}'
          Write-Host "== 顶层内容 =="
          Get-ChildItem -Path $app | Select-Object Mode, Length, Name | Format-Table | Out-String | Write-Host
          $must = @('启动.exe', '启动.bat', '启动.py', '使用说明.txt', '创建桌面图标.bat', '创建桌面图标.vbs', '运行环境')
          $missing = @()
          foreach ($m in $must) { if (-not (Test-Path -LiteralPath (Join-Path $app $m))) { $missing += $m } }
          if ($missing.Count -gt 0) { throw "包内容缺少：$($missing -join ', ')" }
          Write-Host "包内容必需项齐全"
          $init = Get-Content -LiteralPath (Join-Path $app 'v8_3\__init__.py') -Raw
          $ver = [regex]::Match($init, '__version__\s*=\s*"([^"]+)"').Groups[1].Value
          Write-Host "包内版本号：$ver"
          if (-not $ver) { throw "读不到版本号" }
          # ASCII-only 检查：这两个 .bat **必须**一个非 ASCII 字节都没有。
          # （启动.bat 例外：它要引用自带运行时目录的中文名字，那 12 个字节不可避免，
          #   且不在命令行参数位置；真正怕乱码的是"文件名匹配"和"中文标签"那种写法。）
          foreach ($f in @('创建桌面图标.bat', '自检-Windows.bat')) {
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path $app $f))
            $bad = ($bytes | Where-Object { $_ -gt 127 }).Count
            if ($bad -gt 0) { throw "$f 含 $bad 个非 ASCII 字节（cmd 下会乱码）" }
            Write-Host "$f 是纯 ASCII"
          }
          # 不能带构建机私有路径。
          # ⚠️ 两个假失败都踩过了：
          #   ① 第一版 '/home/[a-z]+' 把百度 CDN 的 .../v20-main/home/js/*.js 当成了私有路径；
          #   ② 第二版 '/home/[a-z]+/' 仍然命中它（'/home/js/' 完全符合这个形状）。
          # 所以判断方式是：**只在"路径形状"里找**（行首/引号/括号/空白之后的
          # /home/<用户>/ 或 /Users/<用户>/），排除 URL 里的（前面是 . 或 ://）。
          $命中的行 = @()
          Get-ChildItem -Path $app -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
            $内容 = Get-Content -LiteralPath $_.FullName -ErrorAction SilentlyContinue
            $行号 = 0
            foreach ($行 in $内容) {
              $行号++
              # 起点可以是行首、引号、空白、括号、等号、逗号、冒号（含中文全角冒号）
              if ($行 -match '(^|["''\s(=:,，。：；])/(home|Users)/[A-Za-z][A-Za-z0-9_.-]+/') {
                $命中的行 += "$($_.FullName):$行号"
              }
            }
          }
          if ($命中的行.Count -gt 0) { throw "包内有构建机私有路径：$($命中的行 -join ', ')" }
          Write-Host "没有构建机私有路径"

      - name: 创建桌面图标.bat 端到端测试
        shell: pwsh
        run: |
          $app = '${{ steps.fetch.outputs.APP }}'
          $desktop = [Environment]::GetFolderPath('Desktop')
          Write-Host "桌面：$desktop"
          Get-ChildItem -Path $desktop -Filter '*.lnk' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Push-Location $app
          try {
            Write-Host "== 运行 创建桌面图标.bat =="
            $out = & cmd.exe /c "创建桌面图标.bat" 2>&1 | Out-String
            Write-Host $out
            if ($out -match '不是内部或外部命令|is not recognized') { throw "终端里出现乱码/非法命令（历史 bug 复现）" }
            $lnk = Get-ChildItem -Path $desktop -Filter '*.lnk' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $lnk) { throw "桌面没有生成快捷方式" }
            Write-Host "生成：$($lnk.Name)"
            $sh = New-Object -ComObject WScript.Shell
            $sc = $sh.CreateShortcut($lnk.FullName)
            Write-Host "目标：$($sc.TargetPath)"
            Write-Host "工作目录：$($sc.WorkingDirectory)"
            if (-not (Test-Path -LiteralPath $sc.TargetPath)) { throw "快捷方式指向的目标不存在：$($sc.TargetPath)" }
            if ($lnk.BaseName -notmatch '[\u4e00-\u9fa5]') { throw "快捷方式名字没有中文（期望『网盘管理』）：$($lnk.BaseName)" }
            Write-Host "快捷方式名字与目标都正确"
          } finally { Pop-Location }

      - name: 启动程序并抓日志
        shell: pwsh
        run: |
          $app = '${{ steps.fetch.outputs.APP }}'
          Push-Location $app
          try {
            $py = Join-Path $app '运行环境\python\python.exe'
            if (-not (Test-Path -LiteralPath $py)) { $py = Join-Path $app '运行环境\venv\Scripts\python.exe' }
            Write-Host "解释器：$py"
            & $py -c "import sys, PySide6, httpx; print('python', sys.version.split()[0]); print('PySide6', PySide6.__version__); print('httpx', httpx.__version__)"
            if ($LASTEXITCODE -ne 0) { throw "自带运行环境导入依赖失败" }

            Write-Host "== 以 --性能诊断 启动（30 秒后结束）=="
            $p = Start-Process -FilePath $py -ArgumentList @('启动.py', '--性能诊断') -WorkingDirectory $app -PassThru -WindowStyle Minimized
            Start-Sleep -Seconds 30
            if ($p.HasExited) { Write-Host "进程已退出，退出码 $($p.ExitCode)" } else { Write-Host "进程仍在运行（正常：GUI 程序会一直跑）"; Stop-Process -Id $p.Id -Force }
          } finally { Pop-Location }

      - name: 打印日志（关键结论都在这里）
        if: always()
        shell: pwsh
        run: |
          $app = '${{ steps.fetch.outputs.APP }}'
          foreach ($f in @('数据\卡顿诊断.log', '数据\一键启动.log', '数据\界面日志.txt')) {
            $p = Join-Path $app $f
            Write-Host "==================== $f ===================="
            if (Test-Path -LiteralPath $p) {
              Get-Content -LiteralPath $p -Tail 60 -Encoding UTF8 | Write-Host
            } else {
              Write-Host "（没有这个文件）"
            }
          }

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-logs
          path: |
            ${{ steps.fetch.outputs.APP }}/数据/*.log
            ${{ steps.fetch.outputs.APP }}/数据/界面日志.txt
          if-no-files-found: warn
          retention-days: 7
