name: 测试 Windows 发布包

# ============================================================================
# 这个工作流做什么（免费 Windows runner 上的实机测试）
#   GitHub 的 windows-latest 是真 Windows Server，所以可以在这里验证那些
#   "只有 Windows 上才会暴露"的问题 —— 本地 Linux/Wine 测不准：
#     ① 下载刚发布的 Windows 包（默认最新 Release，也可手动指定 tag / 直接上传 zip）
#     ② 校验包内容与版本号、检查有没有泄露构建机私有路径
#     ③ **创建桌面图标.bat** 端到端跑一遍（历史上这里乱码 + 创建失败）：
#        在"中文 + 空格"的路径下解压，再跑脚本，确认桌面真的出现 .lnk，且名字是中文
#     ④ 启动程序并抓日志（一键启动.log / 界面日志.txt / 卡顿诊断.log），
#        再把日志当 artifact 传上来，方便直接看结论
#
# 说明：Windows runner 是无交互会话，GUI 可能不渲染，所以 ④ 只做"能不能起来，
# 起来后卡在哪一步"的判断（不判定界面流畅度）；卡顿的现场证据靠 --性能诊断。
#
# 触发：Actions → 测试 Windows 发布包 → Run workflow
#      或推送带 win-test 字样的 tag。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空 = 最新一个 Release）'
        required: false
        default: ''
      url:
        description: '直接给一个 zip 直链（留空则用上面的 tag）'
        required: false
        default: ''
  push:
    tags:
      - '*-win-test'

permissions:
  contents: read

jobs:
  win-test:
    name: 在 windows-latest 上测发布包
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 基本信息
        shell: pwsh
        run: |
          Write-Host "runner : $env:ImageOS / $env:RUNNER_OS / $env:RUNNER_ARCH"
          Write-Host "版本   : $($PSVersionTable.PSVersion)"
          Write-Host "系统   : $([System.Environment]::OSVersion.VersionString)"
          Write-Host "工作目录: $PWD"

      - name: 解析下载地址并下载
        id: fetch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = $env:INPUT_URL
          if (-not $url) {
            $tag = $env:INPUT_TAG
            if (-not $tag) {
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
              $tag = $rel.tag_name
              Write-Host "最新 Release：$tag"
            } else {
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
            }
            $asset = $rel.assets | Where-Object { $_.name -like '*Windows*.zip' } | Select-Object -First 1
            if (-not $asset) { throw "这个 Release 里没有 Windows 包：$($rel.assets.name -join ', ')" }
            $url = $asset.browser_download_url
            Write-Host "资源：$($asset.name)  $([math]::Round($asset.size/1MB,1)) MB"
          }
          # 解压到"中文 + 空格"路径：历史上 创建桌面图标.bat 就是在中文路径下失败的
          $root = Join-Path $env:RUNNER_TEMP '中文 路径 测试\网盘管理'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'pkg.zip'
          Write-Host "下载：$url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Write-Host "包大小：$([math]::Round((Get-Item $zip).Length/1MB,1)) MB"
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $inner = Get-ChildItem -Path $root -Directory | Select-Object -First 1
          $app = if ($inner) { $inner.FullName } else { $root }
          Write-Host "解压到：$app"
          "APP=$app" >> $env:GITHUB_OUTPUT

      - name: 包内容与版本号
        shell: pwsh
        run: |
          $app = '${{ steps.fetch.outputs.APP }}'
          Write-Host "== 顶层内容 =="
          Get-ChildItem -Path $app | Select-Object Mode, Length, Name | Format-Table | Out-String | Write-Host
          $must = @('启动.exe', '启动.bat', '启动.py', '使用说明.txt', '创建桌面图标.bat', '创建桌面图标.vbs', '运行环境')
          $missing = @()
          foreach ($m in $must) { if (-not (Test-Path -LiteralPath (Join-Path $app $m))) { $missing += $m } }
          if ($missing.Count -gt 0) { throw "包内容缺少：$($missing -join ', ')" }
          Write-Host "包内容必需项齐全"
          $init = Get-Content -LiteralPath (Join-Path $app 'v8_3\__init__.py') -Raw
          $ver = [regex]::Match($init, '__version__\s*=\s*"([^"]+)"').Groups[1].Value
          Write-Host "包内版本号：$ver"
          if (-not $ver) { throw "读不到版本号" }
          # ASCII-only 检查：包根目录的 .bat **一个非 ASCII 字节都不能有**（不再留例外）。
          # 原因（Wine 实测，与历史 bug 一致）：cmd 按控制台代码页解码 .bat 的字节，
          # 中文字面量在 `if exist` / `for` 里匹配不上真实文件名（`dir` 列得出来，
          # `if exist` 却报 NO，加 chcp 65001 也一样），还可能把命令行拆成非法命令。
          # 运行时目录的中文名现在用 `for /d` 从文件系统取，所以这条能覆盖每一个 .bat。
          # 注意：这里测的是**已发布的包**；源码改完要重新打包发布，这条才会变绿。
          $bats = @(Get-ChildItem -Path $app -Filter '*.bat' -File)
          if ($bats.Count -eq 0) { throw "包根目录一个 .bat 都没有，包里是不是少东西了？" }
          foreach ($f in $bats) {
            $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
            $bad = ($bytes | Where-Object { $_ -gt 127 }).Count
            if ($bad -gt 0) {
              throw "$($f.Name) 含 $bad 个非 ASCII 字节（cmd 下会乱码）。若源码已是纯 ASCII，多半是这个 Release 里的包还没重新打包。"
            }
            Write-Host "$($f.Name) 是纯 ASCII"
          }
          # 不能带构建机私有路径（发布包要能在别人机器上跑，也不该泄露作者用户名）。
          # 只查几个"真出过/真会出问题"的地方，避免误报：
          #   * .py 首行的 shebang：被写死成 /home/<用户>/… 时整个运行环境会跑到别人的家目录；
          #   * pyvenv.cfg 的 home=/executable=：写死构建机路径会让自带解释器起不来；
          #   * _sysconfigdata*.py 里的前缀。
          # 不再全包扫 '/home/xxx' —— 那种写法会把百度 CDN 的 .../home/js/*.js
          # 当成私有路径（连踩两次假失败），也会把 runner 自己的临时目录算进去。
          $坏 = @()
          $候选 = Get-ChildItem -Path $app -Recurse -File -Include '*.py', 'pyvenv.cfg',
                  '_sysconfigdata*' -ErrorAction SilentlyContinue
          foreach ($f in $候选) {
            $相对 = $f.FullName.Substring($app.Length).TrimStart('\')
            $内容 = Get-Content -LiteralPath $f.FullName -Raw -ErrorAction SilentlyContinue
            if (-not $内容) { continue }
            if ($相对 -like '运行环境*') {
              # 运行环境里允许出现本机路径占位符，但**不允许**出现别人的家目录
              if ($内容 -match '/home/(?!<)[A-Za-z][A-Za-z0-9_.-]+/' -or
                  $内容 -match '/Users/[A-Za-z][A-Za-z0-9_.-]+/') { $坏 += $相对 }
            }
          }
          if ($坏.Count -gt 0) { throw "包内的运行环境写死了构建机路径：$($坏 -join ', ')" }
          Write-Host "运行环境里没有写死的构建机路径"

      - name: 创建桌面图标.bat 端到端测试
        shell: pwsh
        run: |
          $app = '${{ steps.fetch.outputs.APP }}'
          $desktop = [Environment]::GetFolderPath('Desktop')
          Write-Host "桌面：$desktop"
          Get-ChildItem -Path $desktop -Filter '*.lnk' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Push-Location $app
          try {
            Write-Host "== 运行 创建桌面图标.bat =="
            $out = & cmd.exe /c "创建桌面图标.bat" 2>&1 | Out-String
            Write-Host $out
            if ($out -match '不是内部或外部命令|is not recognized') { throw "终端里出现乱码/非法命令（历史 bug 复现）" }
            # ⚠️ 只认「网盘管理.lnk」，而且**必须用原生 Unicode 接口（IShellLinkW）读目标**：
            #    `WScript.Shell.CreateShortcut(...).TargetPath` 跟写入一样按系统 ANSI 代码页
            #    处理路径，英文版 Windows 上读中文目标返回空串 —— 拿它校验会把**好的**
            #    快捷方式误判成"目标不存在"（2026-09-21 就是这样误报了一轮）。
            #    包里自带的「建快捷方式_兜底.ps1 -Read」就是同一套 IShellLinkW。
            $lnk = Join-Path $desktop '网盘管理.lnk'
            if (-not (Test-Path -LiteralPath $lnk)) {
              Write-Host "桌面上的东西："
              Get-ChildItem -Path $desktop | Select-Object Name | Format-Table -AutoSize
              throw "桌面没有生成 网盘管理.lnk"
            }
            $helper = Join-Path $app '建快捷方式_兜底.ps1'
            if (-not (Test-Path -LiteralPath $helper)) { throw "包里缺少 建快捷方式_兜底.ps1" }
            $读 = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $helper -Read $lnk 2>&1 | Out-String
            Write-Host "IShellLinkW 读回：$($读.Trim())"
            if ($读 -notmatch '\[OK\] target=') { throw "快捷方式里读不到目标（空壳 .lnk）" }
            $目标 = ($读 -replace '(?s).*\[OK\] target=', '').Trim()
            if (-not (Test-Path -LiteralPath $目标)) { throw "快捷方式指向的目标不存在：$目标" }
            if ($目标 -notmatch '启动') { throw "快捷方式目标不像启动器：$目标" }
            Write-Host "快捷方式名字与目标都正确：$目标"
          } finally { Pop-Location }

      - name: 内置 VLC 必须能用（用户报过"装完不能播"）
        shell: pwsh
        run: |
          # 用户反馈的致命问题：Windows 版发布出去之后播放页直接报
          #   "libvlc 不可用：找不到 libvlc（VLC 的运行库）"
          # —— 因为 Windows 不像桌面 Linux 自带 VLC。现在包内必须自带一份，
          #    这条检查就是钉住它：**在没装 VLC 的干净 runner 上**必须可用。
          $app = '${{ steps.fetch.outputs.APP }}'
          $vlc = Join-Path $app '运行环境\vlc'
          if (-not (Test-Path -LiteralPath (Join-Path $vlc 'libvlc.dll'))) {
            throw "包内没有 运行环境\vlc\libvlc.dll —— Windows 版必须内置 VLC"
          }
          $插件 = @(Get-ChildItem -Path (Join-Path $vlc 'plugins') -Recurse -Filter '*.dll' -File)
          Write-Host "包内 VLC：libvlc.dll 有了，插件 $($插件.Count) 个"
          if ($插件.Count -lt 50) { throw "包内 VLC 插件不全（$($插件.Count) 个）" }
          if (-not (Test-Path -LiteralPath (Join-Path $vlc 'COPYING.txt'))) {
            throw "包内 VLC 没有许可证文件（GPL/LGPL 要求随包分发）"
          }
          Push-Location $app
          try {
            $py = Join-Path $app '运行环境\python\python.exe'
            if (-not (Test-Path -LiteralPath $py)) { $py = Join-Path $app '运行环境\venv\Scripts\python.exe' }
            # ⚠️ 检查脚本用**包里自带的那个文件**（工具/检查内置vlc.py，UTF-8），
            #    不要用 python -c：Windows 的 python -c 走命令行编码（cp1252/GBK），
            #    源码里的中文会抛 UnicodeEncodeError —— 实测把 CI 卡红过一次。
            & $py (Join-Path $app '工具\检查内置vlc.py')
            if ($LASTEXITCODE -ne 0) { throw "内置 VLC 加载失败（播放会不可用）" }
            Write-Host "内置 VLC 可用 ✓"
          } finally { Pop-Location }

      - name: 下载模型不许弹黑框（VIP 用户反馈）
        shell: pwsh
        run: |
          # 用户实测：点"下载 AI 模型"会弹出两个关不掉的大黑框（ollama serve / pull）。
          # 判据：用 GUI 子系统的 pythonw 当父进程，分别裸起 / 用 v8_3.进程.起 各起一个
          # 控制台子进程，看子进程有没有被分到控制台窗口。
          $app = '${{ steps.fetch.outputs.APP }}'
          Push-Location $app
          try {
            $pyw = Join-Path $app '运行环境\python\pythonw.exe'
            if (-not (Test-Path -LiteralPath $pyw)) { $pyw = Join-Path $app '运行环境\venv\Scripts\pythonw.exe' }
            if (-not (Test-Path -LiteralPath $pyw)) { throw "包内找不到 pythonw.exe（GUI 子系统解释器）" }
            & $pyw (Join-Path $app '工具\检查不弹黑框.py')
            if ($LASTEXITCODE -ne 0) { throw "起子进程会弹黑框（下载模型时会冒出黑窗口）" }
          } finally { Pop-Location }

      - name: 启动程序并抓日志
        shell: pwsh
        run: |
          $app = '${{ steps.fetch.outputs.APP }}'
          Push-Location $app
          try {
            $py = Join-Path $app '运行环境\python\python.exe'
            if (-not (Test-Path -LiteralPath $py)) { $py = Join-Path $app '运行环境\venv\Scripts\python.exe' }
            Write-Host "解释器：$py"
            & $py -c "import sys, PySide6, httpx; print('python', sys.version.split()[0]); print('PySide6', PySide6.__version__); print('httpx', httpx.__version__)"
            if ($LASTEXITCODE -ne 0) { throw "自带运行环境导入依赖失败" }

            Write-Host "== 以 --性能诊断 启动（30 秒后结束）=="
            $p = Start-Process -FilePath $py -ArgumentList @('启动.py', '--性能诊断') -WorkingDirectory $app -PassThru -WindowStyle Minimized
            Start-Sleep -Seconds 30
            if ($p.HasExited) { Write-Host "进程已退出，退出码 $($p.ExitCode)" } else { Write-Host "进程仍在运行（正常：GUI 程序会一直跑）"; Stop-Process -Id $p.Id -Force }
          } finally { Pop-Location }

      - name: 打印日志（关键结论都在这里）
        if: always()
        shell: pwsh
        run: |
          $app = '${{ steps.fetch.outputs.APP }}'
          foreach ($f in @('数据\卡顿诊断.log', '数据\一键启动.log', '数据\界面日志.txt')) {
            $p = Join-Path $app $f
            Write-Host "==================== $f ===================="
            if (Test-Path -LiteralPath $p) {
              Get-Content -LiteralPath $p -Tail 60 -Encoding UTF8 | Write-Host
            } else {
              Write-Host "（没有这个文件）"
            }
          }

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-logs
          path: |
            ${{ steps.fetch.outputs.APP }}/数据/*.log
            ${{ steps.fetch.outputs.APP }}/数据/界面日志.txt
          if-no-files-found: warn
          retention-days: 7
