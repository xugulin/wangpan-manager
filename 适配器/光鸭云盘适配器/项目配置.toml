[project]
name = "guangya-adapter"
version = "0.1.0"
description = "光鸭云盘独立适配器"
requires-python = ">=3.10,<3.14"   # 建议 3.12，避开 3.14 GC 段错误
dependencies = [
    "httpx>=0.27.0",
    "qrcode>=7.4.2",
    "PySide6>=6.10.1",
    "oss2>=2.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
光鸭 = "命令行:入口"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"