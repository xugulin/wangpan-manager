[project]
name = "baidu-adapter"
version = "1.0.0"
description = "百度网盘独立适配器（桌面客户端）"
# 上限 3.13：原骨架记录 Python 3.14 上 PySide6 有段错误风险。
# ⚠️ 实测补充（2026-09-14）：本机开发 venv 就是 Python 3.14.7 + PySide6 6.11.2，
#    离屏模式（QT_QPA_PLATFORM=offscreen）可正常启动并跑满事件循环；
#    但**带真实显示服务器**的 GUI 未在本机验证过，故仍保守保留上限。
requires-python = ">=3.10,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "PySide6>=6.10.1",
]
# 注 1：oss2（阿里云 OSS SDK）已移除 —— 那是原骨架上传通道专用依赖；
#       百度网盘走 PCS superfile2 分片协议，不需要 OSS SDK。
# 注 2：qrcode（含 Pillow 后端）已移除 —— 原骨架是本地生成二维码；
#       百度网盘由**服务端下发 base64 PNG**，界面直接解码显示即可。

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
